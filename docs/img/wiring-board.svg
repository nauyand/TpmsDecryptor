<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#1a1a1a">Sambungan TPMS ke konektor Serial TPMS di board</text>

  <!-- Receiver TPMS -->
  <rect x="30" y="85" width="230" height="230" rx="10" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="145" y="117" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Receiver TPMS</text>
  <text x="145" y="139" font-size="13" text-anchor="middle" fill="#666">(kabel serial TPMS)</text>
  <text x="240" y="155" font-size="17" font-weight="bold" text-anchor="end" fill="#006ecd">GND</text>
  <text x="240" y="200" font-size="17" font-weight="bold" text-anchor="end" fill="#e26e00">TX</text>
  <text x="240" y="245" font-size="17" font-weight="bold" text-anchor="end" fill="#888">RX</text>
  <text x="270" y="245" font-size="14" fill="#888">tidak perlu</text>

  <!-- kabel -->
  <polyline points="260,150 720,150 720,222" fill="none" stroke="#006ecd" stroke-width="5"/>
  <polyline points="260,195 660,195 660,222" fill="none" stroke="#e26e00" stroke-width="5"/>
  <circle cx="260" cy="150" r="6" fill="#006ecd"/>
  <circle cx="260" cy="195" r="6" fill="#e26e00"/>
  <circle cx="260" cy="240" r="5" fill="#aaa"/>
  <text x="440" y="140" font-size="14" text-anchor="middle" fill="#006ecd">ground</text>
  <text x="440" y="185" font-size="14" text-anchor="middle" fill="#e26e00">data TPMS</text>

  <!-- board -->
  <rect x="540" y="262" width="330" height="150" rx="6" fill="#1e6b37" stroke="#14502a" stroke-width="2"/>
  <!-- rumah konektor (putih) -->
  <rect x="570" y="222" width="180" height="48" rx="4" fill="#fafafa" stroke="#777" stroke-width="2"/>
  <line x1="600" y1="222" x2="600" y2="270" stroke="#ddd" stroke-width="2"/>
  <!-- pin -->
  <circle cx="600" cy="292" r="12" fill="#d9d9d9" stroke="#888" stroke-width="3"/>
  <circle cx="660" cy="292" r="12" fill="#d9d9d9" stroke="#e26e00" stroke-width="5"/>
  <circle cx="720" cy="292" r="12" fill="#d9d9d9" stroke="#2f9bff" stroke-width="5"/>
  <text x="600" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#cfcfcf">TX</text>
  <text x="660" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffb15c">RX</text>
  <text x="720" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#7cc0ff">GND</text>
  <text x="600" y="350" font-size="13" text-anchor="middle" fill="#cfcfcf">pin 1</text>
  <text x="660" y="350" font-size="13" text-anchor="middle" fill="#ffd7aa">pin 2</text>
  <text x="720" y="350" font-size="13" text-anchor="middle" fill="#bfe0ff">pin 3</text>
  <text x="705" y="395" font-size="15" text-anchor="middle" fill="#ffffff">Board PCB: IC RS232, lalu ke MCU</text>
  <text x="762" y="234" font-size="13" fill="#555">konektor</text>
  <text x="762" y="250" font-size="13" fill="#555">Serial TPMS</text>

  <text x="30" y="372" font-size="15" fill="#333">Wajib: TX TPMS ke RX (pin tengah),</text>
  <text x="30" y="394" font-size="15" fill="#333">GND TPMS ke GND (pin 3).</text>
  <text x="30" y="424" font-size="13" fill="#666">Urutan pin dilihat dengan konektor di tepi atas board (lihat foto pinout).</text>
</svg>
